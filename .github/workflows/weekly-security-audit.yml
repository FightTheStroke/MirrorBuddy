name: Weekly Security Audit

on:
  schedule:
    # Every Monday at 08:00 UTC
    - cron: '0 8 * * 1'
  workflow_dispatch: # Allow manual trigger

permissions:
  contents: read
  issues: write

jobs:
  security-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run pnpm audit
        id: audit
        run: |
          pnpm audit --audit-level=high > audit-report.txt 2>&1 || echo "AUDIT_FAILED=true" >> "$GITHUB_OUTPUT"

      # One tracking issue, updated in place. Opening a fresh issue every week
      # produced #631, #581 and #573 for the same finding, which buried the
      # root cause instead of surfacing it.
      - name: Open or update the tracking issue
        if: steps.audit.outputs.AUDIT_FAILED == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const report = fs.readFileSync('audit-report.txt', 'utf8');
            const truncated = report.length > 3000
              ? report.substring(0, 3000) + '\n\n... (truncated)'
              : report;

            const TITLE = 'Security: pnpm audit found high-severity vulnerabilities';
            const body = [
              '## Weekly Security Audit',
              '',
              `Last run: ${new Date().toISOString()} (${context.sha.substring(0, 7)})`,
              '',
              '`pnpm audit --audit-level=high` found vulnerabilities:',
              '',
              '```',
              truncated,
              '```',
              '',
              '**Action required**: Review and update affected packages.',
              '',
              'Run locally: `pnpm audit` for the full report.',
            ].join('\n');

            const existing = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'security,dependencies',
              per_page: 100,
            });
            const tracking = existing.find((i) => i.title === TITLE && !i.pull_request);

            if (tracking) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: tracking.number,
                body,
              });
              core.info(`Updated tracking issue #${tracking.number}`);
            } else {
              const created = await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: TITLE,
                body,
                labels: ['security', 'dependencies'],
              });
              core.info(`Opened tracking issue #${created.data.number}`);
            }
