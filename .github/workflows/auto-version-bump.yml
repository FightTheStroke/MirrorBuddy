name: Auto Version Bump

# Opens a PR that bumps package.json/VERSION based on Conventional Commits
# (scripts/auto-version.sh). Branch protection on `main` disallows direct
# pushes, so we never push to main from this workflow. The follow-up release
# tag is created by `tag-on-release-merge.yml` once the PR is merged.
#
# The PR merges itself: this workflow turns on GitHub auto-merge, so the bump
# lands on main as soon as the required checks go green, with no human click.
# Release PRs used to wait for someone to press "Enable auto-merge" and simply
# never got pressed — v0.29.1 and v0.30.0 sat open for a day, went stale, and
# froze the version shown in production while main kept moving. The branch
# protection on main (required checks "Build & Lint" and "PR Gate") is what
# still gates the merge; nothing here bypasses it.
#
# The branch push and the PR both use RELEASE_PAT rather than GITHUB_TOKEN.
# GitHub deliberately does not start workflow runs for anything pushed with
# GITHUB_TOKEN, so with GITHUB_TOKEN the required checks never reported and
# every release PR stayed BLOCKED forever (#705, #710, #715, #722, #727).
#
# Loop guards (any one is sufficient):
#   1. head_commit.author is github-actions[bot] — covers direct bot pushes,
#      but NOT the release merge commit, which is attributed to whoever
#      approved the merge. Guard 2 is what stops that one.
#   2. head_commit.message contains "chore(release): v" (the merge commit of
#      a previous auto-release PR carries the PR title in its body)
#   3. bump=none from auto-version.sh (no releasable commits)
#   4. branch `chore/auto-release-v<next>` already exists on origin — note
#      that the repo deletes branches on merge, so this guard only covers a
#      PR that is still open.

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: auto-version-bump-main
  cancel-in-progress: false

jobs:
  bump:
    name: Open release PR
    runs-on: ubuntu-latest
    if: |
      !contains(github.event.head_commit.message, '[skip ci]') &&
      !contains(github.event.head_commit.message, 'chore(release): v') &&
      github.event.head_commit.author.username != 'github-actions[bot]'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # RELEASE_PAT, not GITHUB_TOKEN: GitHub deliberately does not start
          # workflow runs for anything pushed with GITHUB_TOKEN, so the branch
          # this job pushes would never get its required checks ("Build & Lint"
          # and "PR Gate") and the release PR would stay BLOCKED forever.
          # That stranded #705, #710, #715, #722 and #727.
          token: ${{ secrets.RELEASE_PAT }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Compute next version
        id: bump
        run: |
          ./scripts/auto-version.sh --json > /tmp/bump.json
          cat /tmp/bump.json
          NEXT=$(node -p "JSON.parse(require('fs').readFileSync('/tmp/bump.json','utf8')).newVersion")
          BUMP=$(node -p "JSON.parse(require('fs').readFileSync('/tmp/bump.json','utf8')).bumpType")
          echo "next=$NEXT" >> $GITHUB_OUTPUT
          echo "bump=$BUMP" >> $GITHUB_OUTPUT

      - name: Check branch idempotency
        id: branch
        if: steps.bump.outputs.bump != 'none'
        run: |
          NEXT="${{ steps.bump.outputs.next }}"
          BRANCH="chore/auto-release-v${NEXT}"
          if git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null 2>&1; then
            echo "Branch $BRANCH already exists on origin — skipping."
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi
          echo "name=$BRANCH" >> $GITHUB_OUTPUT

      - name: Apply bump and push branch
        if: steps.bump.outputs.bump != 'none' && steps.branch.outputs.exists == 'false'
        run: |
          NEXT="${{ steps.bump.outputs.next }}"
          BRANCH="${{ steps.branch.outputs.name }}"
          git checkout -b "$BRANCH"
          ./scripts/auto-version.sh --apply
          git add \
            VERSION \
            package.json \
            apps/web/package.json \
            robot/pyproject.toml \
            robot/reachy_mini_mirrorbuddy/__init__.py
          git commit -m "chore(release): v${NEXT}" -m "Automated version bump from Conventional Commits since last tag."
          git push origin "$BRANCH"

      - name: Open release PR and let it merge itself
        id: pr
        if: steps.bump.outputs.bump != 'none' && steps.branch.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PAT }}
        run: |
          NEXT="${{ steps.bump.outputs.next }}"
          BRANCH="${{ steps.branch.outputs.name }}"
          PR_URL=$(gh pr create \
            --base main \
            --head "$BRANCH" \
            --title "chore(release): v${NEXT}" \
            --body $'Automated version bump.\n\nGenerated by `auto-version-bump.yml` from Conventional Commits since last tag.\n\nAuto-merge is already enabled: this PR merges itself as soon as the required checks are green, and `tag-on-release-merge.yml` then creates the `v'"${NEXT}"$'` tag from the merge commit. To stop a release, close this PR.')
          echo "Opened $PR_URL"
          echo "url=$PR_URL" >> $GITHUB_OUTPUT

      # Squash merging is disabled on this repo, so a merge commit it is —
      # tag-on-release-merge.yml reads the version off that merge commit.
      - name: Enable auto-merge
        if: steps.pr.outputs.url != ''
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PAT }}
        run: gh pr merge "${{ steps.pr.outputs.url }}" --auto --merge
