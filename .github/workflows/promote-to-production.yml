name: Promote to Production

on:
  workflow_dispatch:
    inputs:
      deployment_url:
        description: "Staging deployment URL to promote (leave empty for latest)"
        required: false
        type: string
      skip_health_check:
        description: "Skip post-promotion health check"
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  deployments: write
  issues: write

env:
  VERCEL_CLI_VERSION: "56.3.2"

jobs:
  promote:
    name: "🚀 Promote Staging → Production"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Vercel CLI
        run: npm install -g "vercel@${VERCEL_CLI_VERSION}"

      - name: Validate VERCEL_TOKEN
        run: |
          if [ -z "${{ secrets.VERCEL_TOKEN }}" ]; then
            echo "::error::VERCEL_TOKEN is not configured"
            exit 1
          fi
          echo "✅ VERCEL_TOKEN is configured"

      - name: Find Staging Deployment
        id: find-staging
        run: |
          SCOPE="--scope=team_nDwLfqx9JbVIs4C7Il79f4ln"
          if [ -n "${{ inputs.deployment_url }}" ]; then
            echo "Using provided deployment URL: ${{ inputs.deployment_url }}"
            echo "deployment_url=${{ inputs.deployment_url }}" >> $GITHUB_OUTPUT
          else
            echo "Finding latest staging deployment..."
            url=$(bash scripts/ci/find-ready-deployment.sh "${{ secrets.VERCEL_TOKEN }}" "$SCOPE")
            echo "deployment_url=$url" >> $GITHUB_OUTPUT
            echo "Found latest deployment: $url"
          fi

      - name: Pre-promotion Staging Health Check
        run: |
          url="${{ steps.find-staging.outputs.deployment_url }}"
          echo "Verifying staging deployment is healthy: $url"
          status=$(curl -s -o /dev/null -w "%{http_code}" "$url/api/health")
          if [ "$status" != "200" ]; then
            echo "::error::Staging deployment is not healthy (HTTP $status)"
            echo "URL: $url"
            echo "Please verify the staging deployment is working before promoting"
            exit 1
          fi
          echo "✅ Staging is healthy (HTTP $status)"

      # The check below imports `pg`, which only exists once the workspace is
      # installed. Without this step the gate fails on a missing module and
      # looks exactly like real schema drift.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Verify database schema is up to date
        env:
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
        run: |
          # The "generate pairing code" button returned 500 for weeks because the
          # RobotDevice table had never been created in production: the code shipped,
          # the migration did not, and nothing said so. Promotion is the last moment
          # where that is still cheap to catch.
          if [ -z "$DIRECT_URL" ]; then
            echo "::error::DIRECT_URL secret is not set — cannot verify schema drift"
            exit 1
          fi
          pnpm exec tsx scripts/check-migrations-applied.ts

      - name: Promote to Production
        id: promote
        run: |
          url="${{ steps.find-staging.outputs.deployment_url }}"
          echo "🚀 Promoting $url to production..."
          # Vercel already promotes the latest main build on its own, so by the
          # time this runs the chosen deployment is often already live. That is
          # the desired end state, not a failure — a red run here sent us looking
          # for a broken deploy that did not exist.
          # A build triggered by the merge may still be running when this starts:
          # Vercel then refuses with "is not ready", which is a matter of waiting.
          promoted=false
          for attempt in $(seq 1 10); do
            if out=$(vercel promote "$url" --token=${{ secrets.VERCEL_TOKEN }} --scope=team_nDwLfqx9JbVIs4C7Il79f4ln --yes 2>&1); then
              echo "$out"
              promoted=true
              break
            fi
            echo "$out"
            if echo "$out" | grep -q "already the current production deployment"; then
              echo "✅ Already in production — nothing to promote"
              promoted=true
              break
            fi
            if echo "$out" | grep -q "is not ready"; then
              echo "Deployment still building; retrying in 30s (attempt $attempt/10)"
              sleep 30
              continue
            fi
            exit 1
          done
          # Running out of attempts is a failure, not a promotion: without this
          # the loop would fall through to the success line below and report a
          # deploy that never went live.
          if [ "$promoted" != "true" ]; then
            echo "::error::Deployment was still not ready after 10 attempts (5 minutes)"
            exit 1
          fi
          echo "✅ Promotion complete"
          echo "promoted_url=$url" >> $GITHUB_OUTPUT

      # This step used to curl the Vercel alias — not mirrorbuddy.org, the domain
      # people actually open — and, on a bad answer, print ::warning:: and let
      # the job go green with "check manually". Nobody checks manually a run
      # that reported success, so a broken promotion had no consequence.
      # The decision now lives in a module with tests, probes the canonical
      # domain, retries the cold start, and FAILS the job when production is not
      # healthy: that failure is the signal to roll back.
      - name: Post-promotion Health Check
        if: ${{ !inputs.skip_health_check }}
        run: pnpm exec tsx scripts/ci/check-production-health.ts

      - name: Update GitHub Deployment Status
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            const url = '${{ steps.find-staging.outputs.deployment_url }}';
            const { data: deployment } = await github.rest.repos.createDeployment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: context.sha,
              environment: 'Production',
              auto_merge: false,
              required_contexts: [],
              description: `Promoted from staging: ${url}`,
            });
            await github.rest.repos.createDeploymentStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              deployment_id: deployment.id,
              state: 'success',
              environment_url: 'https://www.mirrorbuddy.org',
              description: 'Promoted from staging to production',
            });

      - name: Post Summary
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const success = '${{ job.status }}' === 'success';
            const stagingUrl = '${{ steps.find-staging.outputs.deployment_url }}';
            const icon = success ? '✅' : '❌';
            const status = success ? 'Successfully promoted' : 'Promotion failed';

            await core.summary
              .addHeading(`${icon} Production Promotion`, 2)
              .addTable([
                [{data: 'Staging URL', header: true}, {data: 'Status', header: true}],
                [stagingUrl || 'N/A', status]
              ])
              .addLink('Production', 'https://mirrorbuddy.vercel.app')
              .write();

      - name: Close Staging Reminder Issue
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            const label = 'staging-pending-promotion';
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const open = await github.rest.issues.listForRepo({
              owner, repo, labels: label, state: 'open',
            });
            for (const issue of open.data) {
              await github.rest.issues.update({
                owner, repo, issue_number: issue.number,
                state: 'closed',
                state_reason: 'completed',
              });
              await github.rest.issues.createComment({
                owner, repo, issue_number: issue.number,
                body: '✅ Promoted to production successfully.',
              });
            }
