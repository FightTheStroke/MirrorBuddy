# CodeQL Configuration for MirrorBuddy
# Properly excludes test files from security scanning
# Applied to code scanning default setup via the `github-codeql-config-file`
# repository property (set at the FightTheStroke organization level).
# Reference: https://docs.github.com/en/code-security/concepts/code-scanning/repository-properties

name: "MirrorBuddy CodeQL Config"

# Exclude test files from security analysis
# These use patterns that would trigger false positives:
# - E2E tests use mock cookies without Secure flag (HTTP localhost)
# - Unit tests may use mock data patterns
#
# Patterns are `**/`-prefixed because tests live under monorepo packages
# (apps/web/e2e, packages/*/src/**), not at the repository root.
paths-ignore:
  - "**/e2e/**"
  - "**/*.test.ts"
  - "**/*.test.tsx"
  - "**/*.spec.ts"
  - "**/*.spec.tsx"
  - "**/src/test/**"
  - "**/__tests__/**"
  - "**/__mocks__/**"
  - "**/*.config.ts"
  - "**/*.config.js"
